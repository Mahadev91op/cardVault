<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>

  <!-- Subtle glow ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5" />

  <!-- Virtual Card Shape -->
  <g transform="translate(10, 15)">
    <!-- Back Card (depth effect) -->
    <rect x="2" y="-3" width="40" height="26" rx="5" fill="rgba(129, 140, 248, 0.25)" transform="rotate(-4 22 10)"/>

    <!-- Main Credit Card Body -->
    <rect x="0" y="0" width="44" height="28" rx="6" fill="url(#cardGrad)" filter="url(#glow)"/>
    
    <!-- Holographic stripe accent -->
    <path d="M0,8 Q22,14 44,8 L44,12 Q22,18 0,12 Z" fill="url(#accentGrad)" opacity="0.4"/>

    <!-- Gold Smart Chip -->
    <rect x="6" y="8" width="9" height="7" rx="2" fill="url(#chipGrad)" stroke="#b45309" stroke-width="0.5"/>
    <!-- Chip internal contacts -->
    <line x1="10.5" y1="8" x2="10.5" y2="15" stroke="#78350f" stroke-width="0.5" opacity="0.6"/>
    <line x1="6" y1="11.5" x2="15" y2="11.5" stroke="#78350f" stroke-width="0.5" opacity="0.6"/>

    <!-- Contactless Wi-Fi Symbol -->
    <path d="M19,10 A4,4 0 0,1 19,15" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
    <path d="M21,8 A7,7 0 0,1 21,17" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Embossed Card Numbers (Minimal dots) -->
    <circle cx="7" cy="22" r="1" fill="white" opacity="0.9"/>
    <circle cx="10" cy="22" r="1" fill="white" opacity="0.9"/>
    <circle cx="13" cy="22" r="1" fill="white" opacity="0.9"/>
    <circle cx="16" cy="22" r="1" fill="white" opacity="0.9"/>
    
    <circle cx="21" cy="22" r="1" fill="white" opacity="0.9"/>
    <circle cx="24" cy="22" r="1" fill="white" opacity="0.9"/>
    <circle cx="27" cy="22" r="1" fill="white" opacity="0.9"/>
    <circle cx="30" cy="22" r="1" fill="white" opacity="0.9"/>

    <!-- Card Brand Emblem (Mastercard/Visa style overlap) -->
    <circle cx="33" cy="22" r="3.2" fill="#f43f5e" opacity="0.9"/>
    <circle cx="37" cy="22" r="3.2" fill="#fbbf24" opacity="0.85"/>
  </g>
</svg>
